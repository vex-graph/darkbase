# Vexgraph per-repo CI caller. Installed by vex-graph/worktree tools/python/ci_repos.py.
# The reusable workflow lives in vex-graph/worktree and is pinned to `main`.
name: Vexgraph CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  vexgraph:
    uses: vex-graph/worktree/.github/workflows/repo-check.yml@main
    secrets: inherit
